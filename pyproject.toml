[project]
name = "software-cup-a3-backend"
version = "0.1.0"
description = "Backend foundation for the Software Cup A3 multi-agent learning system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3,<1.0",
    "Pillow>=10.0,<12.0",
    "pydantic>=2.0,<3.0",
    "pypdf>=6.0,<7.0",
    "pypdfium2>=5.0,<6.0",
    "pytesseract>=0.3.13,<1.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "starlette>=0.49.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src/backend"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
